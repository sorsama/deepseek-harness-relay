# dsh-relay bundle layer.
#
# One row, and nothing else is touched. The harness webserver row keeps its
# shipped loopback bind: the relay is a SECOND listener in front of it, so a
# misconfigured or failed relay degrades to "unreachable", never to "open to
# the network". The relay refuses to start if it finds the webserver already
# bound to 0.0.0.0.
#
# There is no `--relay-*` command line, and there cannot be one: the surface
# app owns the invocation's parser and rejects any option it does not declare,
# so a flag a bundle added would fail `dsh web` before this plugin ever loaded.
# Per-invocation overrides therefore read the environment from the `!!js`
# expressions below — the same seam the base bundle uses for DSH_TOOLS_MODE.
# Edit the values here for anything permanent; a profile patch that restates
# this row replaces `config` whole, so keep the expressions you still want.

- insert:
    - id: relay
      name: 'dsh-relay'
      disabled: !!js process.env.DSH_RELAY_DISABLE === '1'
      config:
        bind: !!js process.env.DSH_RELAY_BIND ?? '0.0.0.0'
        port: !!js Number(process.env.DSH_RELAY_PORT ?? 3443)
        stateDir: !!js dshHomePath('relay')
        tls: !!js process.env.DSH_RELAY_TLS ?? 'self-signed'
        publicHostnames: []
        compat:
          addressGrants: true
          addressGrantTtlMs: 86400000
          plainPort: !!js Number(process.env.DSH_RELAY_PLAIN_PORT ?? 0)
