name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The prepare script builds from source; the explicit build below is the
      # signal we want, so keep install from doing it twice.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: the published entry points exist
        shell: bash
        run: test -f lib/index.js
      # 0.2.1 shipped without the harness session signing: the relay paired
      # devices and then had no session of its own to present upstream, so the
      # harness answered every proxied request with 401 and the phone app
      # reported the relay as refusing the device. Unit tests read src/ and
      # cannot see this, so the built bundle is checked directly.
      - name: the harness session signing is in the published bundle
        shell: bash
        run: |
          grep -q 'client-connection/browser-session' lib/index.js
          grep -q 'dsh-auth-' lib/index.js
