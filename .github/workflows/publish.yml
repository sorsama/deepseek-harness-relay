# Publishes to npm when a GitHub release is published, with no npm token
# anywhere: npm's trusted publishing accepts this workflow's OIDC identity in
# place of a login. The package's trusted publisher on npmjs.com must name this
# repository and this file (`publish.yml`), with direct `npm publish` allowed —
# by default a trusted publisher may only stage a publish for later approval.
#
# A release created before this workflow existed is published by hand:
#   gh workflow run publish.yml -f tag=v0.3.0
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.3.0
        required: true

permissions:
  contents: read
  id-token: write # the OIDC token npm trusted publishing exchanges for a publish

# Never two publishes at once, and never cancel one halfway.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      # No dependency cache: a release build installs from the lockfile alone.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: the tag names the version being published
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:pack
      # `prepack` rebuilds both halves before packing. A prerelease goes to
      # `next`, so `latest` only ever moves to a final release.
      - name: publish
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
